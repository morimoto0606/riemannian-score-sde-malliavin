eval_batch_size: 32
now: ${now:%Y-%m-%d}/${now:%H-%M-%S}
resume: false
mode: train
seed: 0
generated_samples_path: ${work_dir}/results/earthquake_malliavin_hutchinson/generated_samples.npy
PROJECT_NAME: score-sde
work_dir: ${hydra:runtime.cwd}
data_dir: ${work_dir}/data/
ckpt_dir: ckpt
logs_dir: logs
logdir: ${work_dir}/results
train_val: false
train_plot: false
test_val: false
test_test: false
test_plot: false
num_workers: 8
paths:
  experiments: results
n_jobs: 2
manifold:
  _target_: geomstats.geometry.hypersphere.Hypersphere
  dim: 2
transform:
  _target_: score_sde.models.Id
flow:
  _target_: riemannian_score_sde.sde.Brownian
  'N': 100
  beta_schedule:
    beta_0: 0.001
    beta_f: 5
base:
  _target_: riemannian_score_sde.models.distribution.DefaultDistribution
pushf:
  _target_: score_sde.models.flow.SDEPushForward
  diffeq: sde
loss:
  _target_: riemannian_score_sde.losses.get_dsm_loss_fn
  like_w: false
  eps: ${eps}
  max_t: 0.2
  thresh: 0.5
  n_max: 5
  debug_teacher_comparison: false
generator:
  _target_: riemannian_score_sde.models.DivFreeGenerator
architecture:
  _target_: score_sde.models.Concat
  hidden_shapes:
  - 512
  - 512
  - 512
  - 512
  - 512
  act: sin
embedding:
  _target_: riemannian_score_sde.models.NoneEmbedding
splits:
- 0.8
- 0.1
- 0.1
batch_size: 32
warmup_steps: 1000
steps: 2000
val_freq: 10000
ema_rate: 0.999
eps: 0.001
dataset:
  _target_: riemannian_score_sde.datasets.earth.Earthquake
  _convert_: partial
  data_dir: ${data_dir}
  name: earthquake
teacher:
  _target_: riemannian_score_sde.teachers.MalliavinTeacher
  covariance_regularization: 1.0e-06
  sampler_eps: ${eps}
  divergence_mode: hutchinson
  hutchinson_probes: 1
  hutchinson_noise: rademacher
name: earthquake
experiment: earthquake
logger:
  csv:
    _target_: score_sde.utils.loggers_pl.CSVLogger
    save_dir: logs
    name: ''
    flush_logs_every_n_steps: 1000
optim:
  _target_: optax.adam
  learning_rate: 0.0002
  b1: 0.9
  b2: 0.999
  eps: 1.0e-08
scheduler:
  _target_: optax.join_schedules
  schedules:
  - _target_: optax.linear_schedule
    init_value: 0.0
    end_value: 1.0
    transition_steps: ${warmup_steps}
  - _target_: optax.cosine_decay_schedule
    init_value: 1.0
    decay_steps: ${eval:${steps}-${warmup_steps}}
    alpha: 0.0
  boundaries:
  - ${warmup_steps}
beta_schedule:
  _target_: score_sde.schedule.LinearBetaSchedule
  beta_0: 0.001
  beta_f: 5.0
  t0: 0.0
  tf: 1.0
