# @package _global_

# SO(3) implicit score matching with its native like_w and no additional
# time reweighting.  The two weighting controls are logged independently.
defaults:
  - so3
  - override /generator: lie_algebra
  - override /loss: ism

name: so3_ism_lambda0
experiment: so3_ism
generated_samples_path: ${work_dir}/results/so3_ism_lambda0/generated_samples.npy

loss:
  like_w: true
  time_weighting: true
  time_weight_lambda: 0.0
