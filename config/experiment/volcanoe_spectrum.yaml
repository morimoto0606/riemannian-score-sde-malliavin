# @package _global_

# Pure truncated spectral S2 score at every sampled time; no switching.
defaults:
  - earth_data
  - /dataset: volcanoe
  - /teacher: spectrum

name: volcanoe_spectrum
experiment: volcanoe

enable_x64: true
steps: 100000
batch_size: 128
eval_batch_size: 128

generated_samples_path: ${work_dir}/results/volcanoe_spectrum/generated_samples.npy
