# @package _global_

# Earthquake DSM with the S2 Varadhan score approximation.
defaults:
  - earth_data
  - /dataset: earthquake
  - /teacher: varadhan

name: earthquake_varadhan
experiment: earthquake

# Explicit VaradhanTeacher uses Log_{Y_t}(Y_0) / tau(t) at every time.
# Keep the legacy loss settings for compatibility; no spectral switching.
loss:
  n_max: -1
  thresh: 1.0

# Match the scoremodel_ext 100k comparison unless overridden on the CLI.
steps: 100000
val_freq: 99999
batch_size: 128
eval_batch_size: 128
enable_x64: true
dtype: float64
